[project]
name = "kupo-py"
version = "0.1.2"
description = "A Cardano Kupo client for Python."
readme = "README.md"
authors = [
    { name = "Elder Millenial", email = "eldermillenial@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp[speedups]>=3.13.2",
    "bump-my-version>=0.28.1",
    "bump2version>=1.0.1",
    "pycardano==0.18.0",
    "pydantic>=2.10.3",
    "python-dotenv==1.0.1",
    "requests>=2.32.3",
    "setuptools>=75.6.0",
    "typer>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/theeldermillenial/kupo-py"
Repository = "https://github.com/theeldermillenial/kupo-py.git"
Issues = "https://github.com/theeldermillenial/kupo-py/issues"

[project.scripts]
kupo = "kupo.__main__:app"

[project.optional-dependencies]
server = [
    "fastapi>=0.124.4",
    "typer>=0.20.0",
    "uvicorn[standard]>=0.38.0",
]
dbsync = [
    "dbsync-py>=1.0.0",
]

[dependency-groups]
dev = [
    "black>=24.10.0",
    "datamodel-code-generator[http]>=0.26.3",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pytest-benchmark>=5.1.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.3",
    "charli3-dendrite==1.3.4.dev4",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.9",
    "mkdocstrings-python>=1.16.7",
    "griffe-pydantic>=1.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kupo"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
current_version = "0.1.2"
parse = """(?x)
    (?P<major>\\d+)\\.
    (?P<minor>\\d+)\\.
    (?P<patch>\\d+)
    (\\-(?P<release>[a-z]+)(?P<dev>\\d+))?
"""
serialize = [
	"{major}.{minor}.{patch}-{release}{dev}",
	"{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = "--no-verify"

[tool.bumpversion.parts.release]
values = ["dev", "release"]
optional_value = "release"
